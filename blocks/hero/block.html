<section class="b-hero b-hero--{variant}">
<!--variant:image-->
  <img class="b-hero__bg" data-edit-img="{p}_image" src="{{img:image}}" alt="">
<!--/variant:image-->
<!--variant:particles-->
  <canvas class="b-hero__particles" aria-hidden="true"></canvas>
<!--/variant:particles-->
  <div class="container b-hero__in">
    <div class="b-hero__text">
<!--variant:wordmark-->
      <svg class="b-hero__stroke" viewBox="0 0 1000 320" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path pathLength="1" d="{{#stroke}}"/></svg>
<!--/variant:wordmark-->
      <span class="eyebrow" data-edit="{p}_eyebrow">{{eyebrow}}</span>
      <h1 data-edit="{p}_title">{{title}}</h1>
      <p data-edit="{p}_text">{{text}}</p>
      <div class="actions">
        <a class="btn" href="{{#cta_href}}" data-edit="{p}_button">{{button}}</a>
        <a class="btn btn--ghost js-phone" href="tel:" data-edit="{p}_call">{{call}}</a>
      </div>
    </div>
<!--variant:split-->
    <figure class="b-hero__figure"><img data-edit-img="{p}_image" src="{{img:image}}" alt=""></figure>
<!--/variant:split-->
<!--variant:wordmark-->
    <div class="b-hero__photos">
      <figure class="b-hero__photo"><img data-edit-img="{p}_image" src="{{img:image}}" alt=""></figure>
      <figure class="b-hero__photo b-hero__photo--2"><img data-edit-img="{p}_image2" src="{{img:image2}}" alt=""></figure>
    </div>
<!--/variant:wordmark-->
  </div>
</section>
