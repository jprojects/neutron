<section class="section b-search">
  <div class="narrow">
    <h2 data-edit="{p}_title">{{title}}</h2>
    <form class="b-search__form" data-search role="search" data-search-empty="{{empty}}">
      <input class="b-search__input" type="search" name="q" placeholder="{{placeholder}}" aria-label="{{placeholder}}" autocomplete="off">
      <div class="b-search__results" data-search-results hidden></div>
    </form>
  </div>
</section>
