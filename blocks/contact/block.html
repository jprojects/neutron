<section class="section b-contact" id="contacte">
  <div class="container b-contact__in">
    <div>
      <span class="eyebrow" data-edit="{p}_eyebrow">{{eyebrow}}</span>
      <h2 data-edit="{p}_title">{{title}}</h2>
      <p data-edit="{p}_text">{{text}}</p>
    </div>
    <ul class="b-contact__list">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7c0 5.2-7 13-7 13S5 14.2 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg><div><small data-edit="label_address">{{@label_address}}</small><span data-edit="address">{{@address}}</span></div></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg><div><small data-edit="label_phone">{{@label_phone}}</small><a class="js-phone" href="tel:" data-edit="phone">{{@phone}}</a></div></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.4 7H4v.9l8 5.4 8-5.4V7h-.4L12 12.2z"/></svg><div><small data-edit="label_email">{{@label_email}}</small><a class="js-email" href="mailto:" data-edit="email">{{@email}}</a></div></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 3v4.6l3.2 1.9-1 1.7L11 12.7V7h2z"/></svg><div><small data-edit="label_hours">{{@label_hours}}</small><span data-edit="hours">{{@hours}}</span></div></li>
    </ul>
  </div>
<!--variant:map-->
  <div class="b-contact__map">
    <iframe data-consent="maps" data-consent-src="{{#map_embed}}" title="Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="b-contact__consent">
      <p data-edit="map_text">{{@map_text}}</p>
      <div class="actions"><button class="btn" type="button" data-cookie-accept="maps" data-edit="map_accept">{{@map_accept}}</button>
        <a class="btn btn--ghost" href="{{#map_link}}" target="_blank" rel="noopener" data-edit="map_link">{{@map_link}}</a></div>
    </div>
  </div>
<!--/variant:map-->
</section>
