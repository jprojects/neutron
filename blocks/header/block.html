<header class="site-header b-header b-header--{variant}">
  <div class="container b-header__in">
    <a class="b-header__brand" href="./"><img class="b-header__logo" data-edit-img="logo" src="{{img:@logo}}" alt="{{@site_name}}"><span class="b-header__name" data-edit="site_name">{{@site_name}}</span></a>
    <button class="b-header__toggle" type="button" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span><span class="sr-only" data-edit="menu">{{@menu}}</span></button>
    <nav class="b-header__nav" id="nav" data-menu>
      {{#nav}}
      {{#langs}}
    </nav>
  </div>
</header>
