<section class="section b-gallery b-gallery--{variant}">
  <div class="container">
    <header class="section-head section-head--center">
      <span class="eyebrow" data-edit="{p}_eyebrow">{{eyebrow}}</span>
      <h2 data-edit="{p}_title">{{title}}</h2>
    </header>
    <ul class="b-gallery__list" data-edit-collection="{p}_photos" data-edit-add="+">
      <li data-edit-item><img data-edit-field="image" src="{{photos[0].image}}" alt="" loading="lazy"></li>
    </ul>
  </div>
</section>
