<section class="section b-text-image b-text-image--{variant}" id="{p}">
  <div class="container b-text-image__in">
    <div class="b-text-image__text">
      <span class="eyebrow" data-edit="{p}_eyebrow">{{eyebrow}}</span>
      <h2 data-edit="{p}_title">{{title}}</h2>
      <div data-edit-collection="{p}_text" data-edit-add="+">
        <p data-edit-item><span data-edit-field="text">{{text[0].text}}</span></p>
      </div>
    </div>
    <figure class="b-text-image__figure"><img data-edit-img="{p}_image" src="{{img:image}}" alt="" loading="lazy"></figure>
  </div>
</section>
