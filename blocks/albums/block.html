<section class="section b-albums">
  <div class="container">
    <header class="section-head">
      <span class="eyebrow" data-edit="{p}_eyebrow">{{eyebrow}}</span>
      <h2 data-edit="{p}_title">{{title}}</h2>
    </header>
    <div class="b-albums__list" data-posts="{collection}">
      <section class="b-albums__album" data-post-item>
        <h3><span data-post="title">Àlbum</span> <small data-post="images.count">0</small></h3>
        <div class="b-albums__grid" data-post-images="images"><a data-post-image-link href="#"><img data-post-image src="" alt="" loading="lazy"></a></div>
      </section>
    </div>
    <p data-posts-empty="{collection}" data-edit="{p}_empty">{{empty}}</p>
  </div>
</section>
