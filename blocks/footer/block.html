<footer class="b-footer">
  <div class="container">
    <div class="b-footer__grid">
      <div>
        <p class="b-footer__name" data-edit="site_name">{{@site_name}}</p>
        <p data-edit="tagline">{{@tagline}}</p>
        {{#social}}
      </div>
      <div>
        <h2 data-edit="footer_contact">{{@footer_contact}}</h2>
        <p data-edit="address">{{@address}}</p>
        <p><a class="js-phone" href="tel:" data-edit="phone">{{@phone}}</a></p>
        <p><a class="js-email" href="mailto:" data-edit="email">{{@email}}</a></p>
      </div>
      <div>
        <h2 data-edit="footer_pages">{{@footer_pages}}</h2>
        <nav class="b-footer__nav" data-menu>{{#nav_plain}}</nav>
      </div>
    </div>
<!--variant:funding-->
    <div class="b-footer__funding">
      <div class="b-footer__funding-text" data-edit-html="funding_html">{{@funding_html}}</div>
      <ul class="b-footer__funding-logos" data-edit-collection="funding_logos" data-edit-add="+">
        <li data-edit-item><img data-edit-field="image" src="{{img:@funding_logo}}" alt="" loading="lazy"></li>
      </ul>
    </div>
<!--/variant:funding-->
    <div class="b-footer__bottom">
      <span data-edit="copyright">{{@copyright}}</span>
      <nav>{{#legal_links}}</nav>
    </div>
  </div>
</footer>
