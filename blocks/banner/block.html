<section class="section b-banner b-banner--{variant}">
  <div class="container b-banner__in">
    <div class="b-banner__text">
      <span class="eyebrow" data-edit="{p}_eyebrow">{{eyebrow}}</span>
      <h2 data-edit="{p}_title">{{title}}</h2>
      <p data-edit="{p}_text">{{text}}</p>
    </div>
    <a class="btn btn--light b-banner__btn" href="{{url}}" data-edit-href="{p}_url" target="_blank" rel="noopener"><span data-edit="{p}_button">{{button}}</span> <span aria-hidden="true">→</span></a>
  </div>
</section>
