<section class="section section--dark b-cta">
  <div class="container b-cta__in">
    <h2 data-edit="{p}_title">{{title}}</h2>
    <p data-edit="{p}_text">{{text}}</p>
    <div class="actions">
      <a class="btn btn--light" href="{{#cta_href}}" data-edit="{p}_button">{{button}}</a>
      <a class="btn btn--outline-light js-phone" href="tel:" data-edit="{p}_call">{{call}}</a>
    </div>
  </div>
</section>
